# Netlify: build settings, SPA fallback and caching. See DEPLOY.md.
# Demo-only rules (noindex header, disallow-all robots.txt) are generated into dist/ by
# build/site-meta-plugin.ts while VITE_DEMO_MODE is on, so they switch off with the flag.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"
  # Base URL for the canonical link, Open Graph tags and JSON-LD.
  SITE_URL = "https://pozhegu.elevateurbox.com"
  # Demo: keep the site out of search engines. Set to "false" for the real launch.
  VITE_DEMO_MODE = "true"
  # VITE_WHATSAPP_NUMBER is personal: set it in the Netlify UI, not here.

# SPA fallback: deep links such as /objekti/objekti-l9/l9-301 load the app, which routes them.
# Existing files (assets, renders, robots.txt) are served first; this only catches the rest.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output (JS, CSS, fonts): the file name changes with the content.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Render images are not content-hashed (e.g. hero-1600.avif), so they are cached for 30 days but
# not marked immutable: a regenerated image with the same name still reaches visitors.
[[headers]]
  for = "/renders/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The app shell must always be revalidated, so a new deploy is picked up at once. SPA routes served
# through the fallback get Netlify's default for HTML (max-age=0, must-revalidate), the same effect.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
